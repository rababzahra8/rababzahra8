<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Living README Garden (preview)</title>
  <desc id="desc">A living garden grown from GitHub commits. Visitors water and plant flowers by opening Issues. Pure SVG + SMIL ? no JavaScript.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4d32"/>
      <stop offset="100%" stop-color="#0f2a1c"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#9bb7e8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9bb7e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="900" height="420" fill="url(#sky)"/>

  <!-- Distant hills -->
  <path d="M0 260 C120 220 220 245 340 230 C460 215 520 250 640 235 C760 220 840 245 900 230 L900 320 L0 320 Z" fill="#143024" opacity="0.85"/>
  <path d="M0 290 C150 260 280 285 420 270 C560 255 680 290 900 265 L900 340 L0 340 Z" fill="#17402c"/>

  <!-- Stars (twinkle via opacity) -->
  <g fill="#dce7ff">
    <circle cx="70" cy="48" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="36" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="70" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="42" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="78" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="32" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="88" r="1"><animate attributeName="opacity" values="0.4;0.95;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="50" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Soft moon -->
  <g transform="translate(780,70)">
    <circle r="34" fill="url(#moonGlow)"/>
    <circle r="18" fill="#eef3ff"/>
    <circle cx="6" cy="-4" r="18" fill="#0b1220" opacity="0.35"/>
  </g>

  <!-- Drifting cloud -->
  <g fill="#8fa4c4" opacity="0.22">
    <g>
      <ellipse cx="0" cy="0" rx="38" ry="16"/>
      <ellipse cx="28" cy="-6" rx="26" ry="14"/>
      <ellipse cx="-26" cy="-2" rx="22" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="-80 110" to="980 110" dur="42s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground -->
  <rect y="300" width="900" height="120" fill="url(#ground)"/>
  <path d="M0 300 Q150 285 300 302 T600 298 T900 305 L900 320 L0 320 Z" fill="#22633f" opacity="0.9"/>

  <!-- Path through garden -->
  <path d="M430 420 C410 380 400 350 420 320" fill="none" stroke="#3a6b4a" stroke-width="28" stroke-linecap="round" opacity="0.55"/>
  <path d="M470 420 C490 380 500 350 480 320" fill="none" stroke="#3a6b4a" stroke-width="28" stroke-linecap="round" opacity="0.55"/>

  <!-- Flower helper groups -->
  <!-- Stem + bloom templates via inline groups -->

  <!-- Wildflowers row -->
  <g id="plot">
    <!-- Flower 1: sunflower (commit-grown) -->
    <g transform="translate(120,295)">
      <line x1="0" y1="0" x2="0" y2="55" stroke="#2f8f4e" stroke-width="3"/>
      <g>
        <g>
          <circle r="14" fill="#f5c542"/>
          <circle r="7" fill="#6b3e12"/>
          <g fill="#ffd56a">
            <ellipse cx="0" cy="-18" rx="5" ry="10"/>
            <ellipse cx="0" cy="18" rx="5" ry="10"/>
            <ellipse cx="-18" cy="0" rx="10" ry="5"/>
            <ellipse cx="18" cy="0" rx="10" ry="5"/>
            <ellipse cx="-13" cy="-13" rx="5" ry="9" transform="rotate(-45)"/>
            <ellipse cx="13" cy="13" rx="5" ry="9" transform="rotate(-45)"/>
            <ellipse cx="13" cy="-13" rx="5" ry="9" transform="rotate(45)"/>
            <ellipse cx="-13" cy="13" rx="5" ry="9" transform="rotate(45)"/>
          </g>
          <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="5s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- Flower 2: rose -->
    <g transform="translate(210,310)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#2f8f4e" stroke-width="2.5"/>
      <g>
        <circle r="9" fill="#e85d75"/>
        <circle cx="-4" cy="-2" r="6" fill="#ff7a90"/>
        <circle cx="4" cy="-1" r="5" fill="#c73b55"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Flower 3: tulip -->
    <g transform="translate(290,300)">
      <line x1="0" y1="0" x2="0" y2="50" stroke="#2f8f4e" stroke-width="2.5"/>
      <path d="M0 -18 C-10 -8 -12 6 0 10 C12 6 10 -8 0 -18 Z" fill="#7ec8ff">
        <animate attributeName="d" dur="4s" repeatCount="indefinite"
          values="M0 -18 C-10 -8 -12 6 0 10 C12 6 10 -8 0 -18 Z;M0 -20 C-11 -9 -13 5 0 10 C13 5 11 -9 0 -20 Z;M0 -18 C-10 -8 -12 6 0 10 C12 6 10 -8 0 -18 Z"/>
      </path>
    </g>

    <!-- Flower 4: lavender cluster -->
    <g transform="translate(370,315)">
      <line x1="-6" y1="0" x2="-6" y2="40" stroke="#2f8f4e" stroke-width="2"/>
      <line x1="4" y1="0" x2="4" y2="38" stroke="#2f8f4e" stroke-width="2"/>
      <g fill="#9b7bdc">
        <circle cx="-6" cy="-8" r="3.5"/>
        <circle cx="-6" cy="-14" r="3"/>
        <circle cx="-6" cy="-19" r="2.5"/>
        <circle cx="4" cy="-6" r="3.5"/>
        <circle cx="4" cy="-12" r="3"/>
        <circle cx="4" cy="-17" r="2.5"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="-2;3;-2" dur="4.5s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- Flower 5: visitor plant (brighter, labeled vibe) -->
    <g transform="translate(520,305)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#2f8f4e" stroke-width="2.5"/>
      <g>
        <circle r="11" fill="#58a6ff"/>
        <circle r="4.5" fill="#0b1220"/>
        <g fill="#8ec8ff">
          <ellipse cx="0" cy="-14" rx="4" ry="8"/>
          <ellipse cx="0" cy="14" rx="4" ry="8"/>
          <ellipse cx="-14" cy="0" rx="8" ry="4"/>
          <ellipse cx="14" cy="0" rx="8" ry="4"/>
        </g>
        <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Flower 6: daisy -->
    <g transform="translate(610,312)">
      <line x1="0" y1="0" x2="0" y2="42" stroke="#2f8f4e" stroke-width="2.5"/>
      <g fill="#f4f1ea">
        <ellipse cx="0" cy="-11" rx="4" ry="8"/>
        <ellipse cx="0" cy="11" rx="4" ry="8"/>
        <ellipse cx="-11" cy="0" rx="8" ry="4"/>
        <ellipse cx="11" cy="0" rx="8" ry="4"/>
        <ellipse cx="-8" cy="-8" rx="4" ry="7" transform="rotate(-45)"/>
        <ellipse cx="8" cy="8" rx="4" ry="7" transform="rotate(-45)"/>
      </g>
      <circle r="5" fill="#f0c14a"/>
    </g>

    <!-- Flower 7: night bloom -->
    <g transform="translate(700,300)">
      <line x1="0" y1="0" x2="0" y2="50" stroke="#2f8f4e" stroke-width="2.5"/>
      <g>
        <path d="M0 -16 L4 -4 L16 -2 L6 6 L8 18 L0 10 L-8 18 L-6 6 L-16 -2 L-4 -4 Z" fill="#ff9f43"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Flower 8: tiny sprouts (recent commits) -->
    <g transform="translate(790,325)" fill="#3ecf8e">
      <path d="M0 20 Q-8 8 -4 -2" fill="none" stroke="#3ecf8e" stroke-width="2"/>
      <path d="M0 20 Q8 10 5 0" fill="none" stroke="#2f8f4e" stroke-width="2"/>
      <ellipse cx="-6" cy="4" rx="6" ry="3" transform="rotate(-35 -6 4)"/>
      <ellipse cx="7" cy="6" rx="6" ry="3" transform="rotate(30 7 6)"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Soft rain when "mood" is rainy (always-on gentle night rain for preview) -->
  <g stroke="#9ec9ff" stroke-width="1.2" opacity="0.35">
    <line x1="90" y1="40" x2="80" y2="70"><animate attributeName="y1" values="40;160" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y2" values="70;190" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="1.4s" repeatCount="indefinite"/></line>
    <line x1="180" y1="20" x2="170" y2="50"><animate attributeName="y1" values="20;180" dur="1.7s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y2" values="50;210" dur="1.7s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0" dur="1.7s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="260" y1="55" x2="250" y2="85"><animate attributeName="y1" values="55;200" dur="1.5s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="y2" values="85;230" dur="1.5s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="1.5s" begin="0.7s" repeatCount="indefinite"/></line>
    <line x1="450" y1="30" x2="440" y2="60"><animate attributeName="y1" values="30;170" dur="1.6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y2" values="60;200" dur="1.6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></line>
    <line x1="640" y1="45" x2="630" y2="75"><animate attributeName="y1" values="45;190" dur="1.8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="y2" values="75;220" dur="1.8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- HUD / legend strip -->
  <rect x="24" y="24" width="360" height="74" rx="10" fill="#0b1220" fill-opacity="0.72" stroke="#58a6ff" stroke-opacity="0.35"/>
  <text x="42" y="52" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700">Living README Garden</text>
  <text x="42" y="74" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">commits grow stems · issues plant flowers · SVG+SMIL only</text>
  <text x="42" y="90" fill="#3ecf8e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">preview · not yet wired to Actions</text>

  <!-- Stats pills (static preview numbers) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <rect x="560" y="28" width="100" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="575" y="46" fill="#8b949e">blooms</text>
    <text x="630" y="46" fill="#58a6ff" font-weight="700">12</text>

    <rect x="672" y="28" width="100" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="687" y="46" fill="#8b949e">watered</text>
    <text x="748" y="46" fill="#3ecf8e" font-weight="700">34</text>

    <rect x="784" y="28" width="92" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="798" y="46" fill="#8b949e">mood</text>
    <text x="840" y="46" fill="#ff9f43" font-weight="700">rain</text>
  </g>

  <!-- Footer prompt -->
  <text x="450" y="392" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
    Open an Issue below to water the garden or plant a flower
  </text>
</svg>
